name: Build & Publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run android:apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duolingo-Clone-APK
          path: android/Duolingo-Clone.apk

      - name: Publish APK to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 android/Duolingo-Clone.apk --clobber
          else
            gh release create v1.0.0 android/Duolingo-Clone.apk \
              --title "Duolingo Clone Android APK v1.0.0" \
              --notes "APK Android completo do Duolingo Clone (gerado automaticamente via Capacitor + Android SDK 35 com bridge nativa AndroidTTS)."
          fi
